[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ird-v3"
version = "3.0.0.dev0"
description = "Imperial Radio Directorate v3 — clean-room rewrite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.0", "ruff>=0.16"]
desktop = ["PySide6>=6.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ on the import path with no install step (pytest >= 7).
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Same baseline as IID v3/ISD v3/ILD v3's own [tool.ruff.lint] (hand-matched,
# each app's own copy — no shared config file per the v3 clean-room/isolation
# principle). UP047 (PEP 695 generic-syntax nudge) excluded — purely
# stylistic, same exclusion the sibling apps carry.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
# A markdown table in a docstring — genuinely can't wrap without breaking
# the table, not a real long-line problem. Same exception ISD v3's own
# ruff config carries for its identical `web/errors.py` shape.
"src/web/errors.py" = ["E501"]
